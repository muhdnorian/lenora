name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: Syntax & sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check every JS module
        run: |
          set -e
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify local index.html references resolve
        run: |
          set -e
          # only local js references (skip CDN / absolute URLs)
          grep -oE 'src="[^"]*\.js"' index.html \
            | sed 's/src="//; s/"//' \
            | grep -vE '^(https?:)?//' \
            | while read ref; do
                test -f "$ref" && echo "OK  $ref" || { echo "MISSING $ref"; exit 1; }
              done

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test
