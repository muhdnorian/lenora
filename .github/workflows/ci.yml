name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: Syntax & sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check every JS module
        run: |
          set -e
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify index.html references resolve
        run: |
          set -e
          grep -oE 'src="[^"]*\.js"' index.html | sed 's/src="//; s/"//' | while read ref; do
            test -f "$ref" && echo "OK  $ref" || { echo "MISSING $ref"; exit 1; }
          done
